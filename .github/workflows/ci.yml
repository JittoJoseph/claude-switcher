name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test with race detection
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build and check the executable
        shell: bash
        run: |
          set -euo pipefail
          exe=bin/claude-switcher
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          go build -o "$exe" ./cmd/claude-switcher
          "$exe" version
          "$exe" --help
      - name: Installer tests in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1 -Binary ./bin/claude-switcher.exe
      - name: Installer tests in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 -Binary ./bin/claude-switcher.exe
